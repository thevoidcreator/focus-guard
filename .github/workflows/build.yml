name: build-and-check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: bash scripts/build-android.sh
      - run: python scripts/check-release.py
      - run: apkanalyzer manifest print android/app/build/outputs/apk/production/release/app-production-release-unsigned.apk > production-manifest.xml
      - run: python scripts/verify-manifest.py production-manifest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: android-phone-guardian-and-production-disabled
          path: dist/android
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - run: pwsh scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-win-x64
          path: dist/FocusGuard-0.2-Windows-win-x64.zip
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: cd android && ./gradlew :app:assembleLabDebug :app:assembleLabDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: bash scripts/emulator-smoke.sh > emulator-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-report
          path: emulator-smoke.log
